[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-reasoning-post-training-lab"
version = "0.1.0"
description = "Measured small-model post-training on verifiable synthetic scientific tasks"
requires-python = ">=3.12,<3.14"
dependencies = ["torch==2.15.0", "transformers==5.22.2", "trl==1.17.1", "peft==0.21.2", "accelerate==1.15.0", "datasets==5.1.0", "matplotlib==3.11.2", "pyyaml==6.0.3", "scipy==1.18.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
scireason = "scireason.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
